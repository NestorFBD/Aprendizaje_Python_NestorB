[project]
name = "python-aprendizaje"
version = "0.1.0"
description = ""
authors = [
    {name = "Nestor Becerra",email = "nestor.becerra@axity.com"}
]
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "mypy (>=2.3.0,<3.0.0)"
]


[tool.isort]
profile = "black"