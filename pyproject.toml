[project]
name = "python-aprendizaje"
version = "0.1.0"
description = "Curso de Python enfocado en Analisis de Datos"
authors = [
    {name = "Nestor Becerra",email = "nestor.becerra@axity.com"}  
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.52.0,<0.53.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "hypothesis (>=6.164.0,<7.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "scikit-learn (>=1.9.0,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "typer[all] (>=0.27.1,<0.28.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)"
]

[project.scripts]
gestor-ordenes = "Modulos.Modulo_17.cli:app"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "ruff (>=0.16.1,<0.17.0)",
    "pre-commit (>=4.6.1,<5.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pip-audit (>=2.10.1,<3.0.0)"
]


[tool.isort]
profile = "black"

# AGREGAMOS ESTE BLOQUE AL FINAL PARA LAS REGLAS INTERNAS DE POETRY
[tool.poetry]
packages = [{include = "Modulos"}]